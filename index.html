<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gorilla Strong - HIT Workout Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Mobile landscape blocking */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #root {
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
            body {
                background: #000 !important;
            }
        }
        
        body {
            background: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        #root {
            min-height: 100vh;
        }

        .diamond-plate {
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,.05) 10px, rgba(255,255,255,.05) 20px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,.05) 10px, rgba(255,255,255,.05) 20px);
        }

        .gorilla-overlay {
            background: rgba(0, 0, 0, 0.95);
        }

        #error-message {
            display: none;
            color: #ff6b6b;
            font-size: 16px;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chrome: {
                            50: '#f8f9fa',
                            100: '#e9ecef',
                            200: '#dee2e6',
                            300: '#ced4da',
                            400: '#adb5bd',
                            500: '#6c757d',
                            600: '#495057',
                            700: '#343a40',
                            800: '#212529',
                            900: '#0d0d0d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <div id="error-message">App failed to load. Please refresh the page.</div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function GorillaStrongApp() {
          const [currentExercise, setCurrentExercise] = useState(null);
          const [currentSet, setCurrentSet] = useState({ weight: 0, reps: 0, seconds: 0 });
          const [workoutHistory, setWorkoutHistory] = useState([]);
          const [activeWorkoutName, setActiveWorkoutName] = useState('');
          const [currentWorkout, setCurrentWorkout] = useState([]);
          const [showProgress, setShowProgress] = useState(false);
          const [selectedExercise, setSelectedExercise] = useState(null);
          const [showWorkoutBuilder, setShowWorkoutBuilder] = useState(false);
          const [customWorkouts, setCustomWorkouts] = useState([]);
          const [editingWorkout, setEditingWorkout] = useState(null);
          const [newWorkoutName, setNewWorkoutName] = useState('');
          const [selectedExercises, setSelectedExercises] = useState([]);
          const [restTimer, setRestTimer] = useState(false);
          const [restTimeRemaining, setRestTimeRemaining] = useState(0);
          const [currentExerciseEquipmentMode, setCurrentExerciseEquipmentMode] = useState('machine');
          const [isChirping, setIsChirping] = useState(false);
          const [chirpVolume, setChirpVolume] = useState(50);
          const [restPeriod, setRestPeriod] = useState(180);
          
          const chirpIntervalRef = useRef(null);
          const audioContextRef = useRef(null);

          const MACHINE_TO_FREEWEIGHT_RATIO = 0.75;
          const CHIRP_INTERVAL = 4000;

          const defaultWorkouts = {
            'Full Body': ['Leg Press', 'Chest Press', 'Pulldown', 'Shoulder Press', 'Leg Curl', 'Bicep Curl', 'Tricep Extension'],
            'Upper Body': ['Chest Press', 'Pulldown', 'Shoulder Press', 'Row', 'Bicep Curl', 'Tricep Extension', 'Lateral Raise'],
            'Lower Body': ['Leg Press', 'Leg Curl', 'Leg Extension', 'Calf Raise', 'Hip Abduction', 'Hip Adduction'],
            'Push Day': ['Chest Press', 'Shoulder Press', 'Incline Press', 'Tricep Extension', 'Lateral Raise', 'Overhead Press'],
            'Pull Day': ['Pulldown', 'Row', 'Face Pull', 'Bicep Curl', 'Shrug', 'Rear Delt Fly']
          };

          const allExercises = [
            'Chest Press', 'Incline Press', 'Decline Press', 'Fly', 'Dip',
            'Pulldown', 'Row', 'Deadlift', 'Shrug', 'Face Pull', 'Rear Delt Fly',
            'Shoulder Press', 'Overhead Press', 'Lateral Raise', 'Front Raise',
            'Bicep Curl', 'Hammer Curl', 'Preacher Curl', 'Tricep Extension', 'Tricep Pushdown', 'Skull Crusher',
            'Leg Press', 'Squat', 'Leg Extension', 'Leg Curl', 'Calf Raise', 'Hip Abduction', 'Hip Adduction', 'Lunge',
            'Ab Crunch', 'Plank', 'Russian Twist', 'Leg Raise'
          ].sort();

          const saveToStorage = (key, data) => {
            const dataStr = JSON.stringify(data);
            try {
              localStorage.setItem(key, dataStr);
              sessionStorage.setItem(key, dataStr);
            } catch (e) {
              console.error('Storage error:', e);
            }
          };

          const loadFromStorage = (key) => {
            try {
              let data = localStorage.getItem(key);
              if (data) return JSON.parse(data);
              data = sessionStorage.getItem(key);
              if (data) return JSON.parse(data);
            } catch (e) {
              console.error('Load error:', e);
            }
            return null;
          };

          const playChirp = () => {
            if (chirpVolume === 0) return;
            try {
              if (!audioContextRef.current) {
                audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
              }
              const ctx = audioContextRef.current;
              const oscillator = ctx.createOscillator();
              const gainNode = ctx.createGain();
              oscillator.connect(gainNode);
              gainNode.connect(ctx.destination);
              oscillator.frequency.value = 440;
              oscillator.type = 'sine';
              const volume = (chirpVolume / 100) * 0.3;
              gainNode.gain.setValueAtTime(volume, ctx.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
              oscillator.start(ctx.currentTime);
              oscillator.stop(ctx.currentTime + 0.15);
            } catch (e) {
              console.error('Chirp error:', e);
            }
          };

          useEffect(() => {
            if (isChirping) {
              playChirp();
              chirpIntervalRef.current = setInterval(() => {
                playChirp();
              }, CHIRP_INTERVAL);
            } else {
              if (chirpIntervalRef.current) {
                clearInterval(chirpIntervalRef.current);
                chirpIntervalRef.current = null;
              }
            }
            return () => {
              if (chirpIntervalRef.current) {
                clearInterval(chirpIntervalRef.current);
              }
            };
          }, [isChirping]);

          useEffect(() => {
            let lock = null;
            const requestWakeLock = async () => {
              try {
                if ('wakeLock' in navigator && (activeWorkoutName || currentExercise || isChirping)) {
                  try {
                    lock = await navigator.wakeLock.request('screen');
                    lock.addEventListener('release', () => {
                      if (activeWorkoutName || currentExercise || isChirping) {
                        setTimeout(() => requestWakeLock(), 100);
                      }
                    });
                  } catch (e) {
                    console.error('Wake lock error:', e);
                  }
                }
              } catch (err) {
                console.error('Wake lock error:', err);
              }
            };
            requestWakeLock();
            return () => {
              if (lock) lock.release().catch(() => {});
            };
          }, [activeWorkoutName, currentExercise, isChirping]);

          useEffect(() => {
            let interval;
            if (restTimer && restTimeRemaining > 0) {
              interval = setInterval(() => {
                setRestTimeRemaining(prev => {
                  if (prev <= 1) {
                    setRestTimer(false);
                    return 0;
                  }
                  return prev - 1;
                });
              }, 1000);
            }
            return () => {
              if (interval) clearInterval(interval);
            };
          }, [restTimer, restTimeRemaining]);

          useEffect(() => {
            if (restTimer) {
              setTimeout(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }, 100);
            }
          }, [restTimer]);

          useEffect(() => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }, [currentExercise, activeWorkoutName, showProgress, showWorkoutBuilder]);

          useEffect(() => {
            if (activeWorkoutName && currentWorkout.length > 0) {
              const workoutState = {
                activeWorkoutName,
                currentWorkout,
                currentExercise,
                currentSet,
                currentExerciseEquipmentMode,
                timestamp: new Date().toISOString()
              };
              saveToStorage('activeWorkoutState', workoutState);
            }
          }, [activeWorkoutName, currentWorkout, currentExercise, currentSet, currentExerciseEquipmentMode]);

          useEffect(() => {
            const history = loadFromStorage('hitWorkoutHistory');
            if (history) setWorkoutHistory(history);
            const custom = loadFromStorage('customWorkouts');
            if (custom) setCustomWorkouts(custom);
            const volume = loadFromStorage('chirpVolume');
            if (volume) setChirpVolume(parseInt(volume));
            const rest = loadFromStorage('restPeriod');
            if (rest) setRestPeriod(parseInt(rest));

            const savedWorkout = loadFromStorage('activeWorkoutState');
            if (savedWorkout && savedWorkout.activeWorkoutName) {
              const timeSinceSave = Date.now() - new Date(savedWorkout.timestamp).getTime();
              if (timeSinceSave < 4 * 60 * 60 * 1000) {
                if (confirm(`Resume your "${savedWorkout.activeWorkoutName}" workout?`)) {
                  setActiveWorkoutName(savedWorkout.activeWorkoutName);
                  setCurrentWorkout(savedWorkout.currentWorkout);
                  if (savedWorkout.currentExercise) {
                    setCurrentExercise(savedWorkout.currentExercise);
                    setCurrentSet(savedWorkout.currentSet);
                    setCurrentExerciseEquipmentMode(savedWorkout.currentExerciseEquipmentMode);
                  }
                } else {
                  saveToStorage('activeWorkoutState', null);
                }
              }
            }
          }, []);

          useEffect(() => {
            saveToStorage('hitWorkoutHistory', workoutHistory);
          }, [workoutHistory]);

          useEffect(() => {
            saveToStorage('customWorkouts', customWorkouts);
          }, [customWorkouts]);

          useEffect(() => {
            saveToStorage('chirpVolume', chirpVolume);
          }, [chirpVolume]);

          useEffect(() => {
            saveToStorage('restPeriod', restPeriod);
          }, [restPeriod]);

          const convertWeight = (weight, fromType, toType) => {
            if (fromType === toType) return weight;
            if (fromType === 'machine' && toType === 'freeweight') {
              return Math.round(weight * MACHINE_TO_FREEWEIGHT_RATIO / 5) * 5;
            }
            if (fromType === 'freeweight' && toType === 'machine') {
              return Math.round((weight / MACHINE_TO_FREEWEIGHT_RATIO) / 5) * 5;
            }
            return weight;
          };

          const getPreviousStats = (exerciseName, equipmentType) => {
            const exerciseHistory = workoutHistory
              .filter(w => w.exercises.some(e => e.exercise === exerciseName))
              .flatMap(w => w.exercises.filter(e => e.exercise === exerciseName)
                .map(e => ({
                  ...e,
                  date: new Date(w.timestamp).toLocaleDateString(),
                  workoutName: w.workoutName,
                  equipmentType: e.equipmentType || 'machine'
                })));

            if (exerciseHistory.length === 0) return null;

            const latestSameEquipment = exerciseHistory
              .filter(e => e.equipmentType === equipmentType)
              .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

            if (latestSameEquipment) {
              return { ...latestSameEquipment, isEstimate: false };
            }

            const latestOtherEquipment = exerciseHistory
              .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

            if (latestOtherEquipment) {
              const convertedWeight = convertWeight(
                latestOtherEquipment.weight,
                latestOtherEquipment.equipmentType,
                equipmentType
              );
              return {
                ...latestOtherEquipment,
                weight: convertedWeight,
                isEstimate: true
              };
            }
            return null;
          };

          const startWorkout = (workoutType) => {
            const exercises = customWorkouts.find(w => w.name === workoutType)?.exercises || defaultWorkouts[workoutType] || [];
            setActiveWorkoutName(workoutType);
            setCurrentWorkout(exercises.map(name => ({ name, completed: false, skipped: false })));
          };

          const startExercise = (exercise) => {
            setCurrentExercise(exercise);
            setCurrentExerciseEquipmentMode('machine');
            if (chirpVolume > 0) setIsChirping(true);
            const prevStats = getPreviousStats(exercise.name, 'machine');
            if (prevStats) {
              setCurrentSet({ weight: prevStats.weight, reps: prevStats.reps, seconds: prevStats.seconds || 0 });
            } else {
              setCurrentSet({ weight: 0, reps: 0, seconds: 0 });
            }
          };

          const completeSet = () => {
            setIsChirping(false);
            if (!currentExercise || (currentSet.weight === 0 && currentSet.reps === 0)) return;

            const completed = {
              exercise: currentExercise.name,
              weight: currentSet.weight,
              reps: currentSet.reps,
              seconds: currentSet.seconds,
              equipmentType: currentExerciseEquipmentMode,
              timestamp: new Date().toISOString()
            };

            setCurrentWorkout(prev => prev.map(ex => ex.name === currentExercise.name ? { ...ex, completed: true, data: completed } : ex));
            setRestTimer(true);
            setRestTimeRemaining(restPeriod);
            setCurrentExercise(null);
          };

          const skipExercise = () => {
            setIsChirping(false);
            if (!currentExercise) return;
            setCurrentWorkout(prev => prev.map(ex => ex.name === currentExercise.name ? { ...ex, skipped: true } : ex));
            const nextIncomplete = currentWorkout.find(ex => !ex.completed && !ex.skipped && ex.name !== currentExercise.name);
            if (nextIncomplete) {
              startExercise(nextIncomplete);
            } else {
              setCurrentExercise(null);
            }
          };

          const unskipExercise = (exerciseName) => {
            setCurrentWorkout(prev => prev.map(ex => ex.name === exerciseName ? { ...ex, skipped: false } : ex));
          };

          const finishWorkout = () => {
            setIsChirping(false);
            const completedExercises = currentWorkout.filter(ex => ex.completed).map(ex => ex.data);
            if (completedExercises.length > 0) {
              const workout = {
                workoutName: activeWorkoutName,
                timestamp: new Date().toISOString(),
                exercises: completedExercises,
                skipped: currentWorkout.filter(ex => ex.skipped).map(ex => ex.name)
              };
              setWorkoutHistory(prev => {
                const newHistory = [workout, ...prev];
                saveToStorage('hitWorkoutHistory', newHistory);
                return newHistory;
              });
            }
            saveToStorage('activeWorkoutState', null);
            setActiveWorkoutName('');
            setCurrentWorkout([]);
            setCurrentExercise(null);
            setCurrentSet({ weight: 0, reps: 0, seconds: 0 });
            setRestTimer(false);
            setRestTimeRemaining(0);
          };

          const saveCustomWorkout = () => {
            if (!newWorkoutName.trim() || selectedExercises.length === 0) return;
            const workout = {
              name: newWorkoutName.trim(),
              exercises: selectedExercises,
              id: editingWorkout?.id || Date.now()
            };
            if (editingWorkout) {
              setCustomWorkouts(prev => prev.map(w => w.id === editingWorkout.id ? workout : w));
            } else {
              setCustomWorkouts(prev => [...prev, workout]);
            }
            setNewWorkoutName('');
            setSelectedExercises([]);
            setEditingWorkout(null);
            setShowWorkoutBuilder(false);
          };

          const deleteCustomWorkout = (id) => {
            if (confirm('Delete this workout?')) {
              setCustomWorkouts(prev => prev.filter(w => w.id !== id));
            }
          };

          const editCustomWorkout = (workout) => {
            setEditingWorkout(workout);
            setNewWorkoutName(workout.name);
            setSelectedExercises(workout.exercises);
            setShowWorkoutBuilder(true);
          };

          const toggleExerciseSelection = (exercise) => {
            setSelectedExercises(prev => prev.includes(exercise) ? prev.filter(e => e !== exercise) : [...prev, exercise]);
          };

          const getExerciseStats = (exerciseName) => {
            const history = workoutHistory.flatMap(w => w.exercises.filter(e => e.exercise === exerciseName)).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            if (history.length === 0) return null;
            const latest = history[0];
            const maxWeight = Math.max(...history.map(e => e.weight));
            const maxReps = Math.max(...history.filter(e => e.weight === maxWeight).map(e => e.reps));
            return { latest, maxWeight, maxReps, totalSessions: history.length };
          };

          const completedCount = currentWorkout.filter(ex => ex.completed).length;
          const totalCount = currentWorkout.length;
          const progress = totalCount > 0 ? (completedCount / totalCount) * 100 : 0;
          const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${(seconds % 60).toString().padStart(2, '0')}`;

          if (currentExercise) {
            const prevStats = getPreviousStats(currentExercise.name, currentExerciseEquipmentMode);
            return (
              <div className="min-h-screen gorilla-overlay p-4 text-chrome-100">
                <div className="max-w-4xl mx-auto">
                  <div className="bg-chrome-800 rounded-xl p-6 shadow-2xl border border-chrome-600 diamond-plate">
                    <div className="mb-6">
                      <div className="flex items-center justify-between mb-2">
                        <h2 className="text-sm font-semibold text-chrome-300">{activeWorkoutName}</h2>
                        <span className="text-sm text-chrome-300">{completedCount} / {totalCount}</span>
                      </div>
                      <div className="w-full bg-chrome-900 rounded-full h-2 border border-chrome-700">
                        <div className="bg-gradient-to-r from-chrome-500 to-chrome-400 h-2 rounded-full transition-all duration-300" style={{ width: `${progress}%` }} />
                      </div>
                    </div>
                    <div className="mb-6">
                      <h3 className="text-3xl font-bold mb-2" style={{ color: '#39FF14' }}>{currentExercise.name}</h3>
                      <p className="text-chrome-400 text-sm mb-3">One set to absolute failure</p>
                      <div className="flex items-center gap-2 mb-4">
                        <span className="text-sm text-chrome-400">Equipment:</span>
                        <button onClick={() => { setCurrentExerciseEquipmentMode('machine'); const stats = getPreviousStats(currentExercise.name, 'machine'); if (stats) setCurrentSet({ weight: stats.weight, reps: stats.reps, seconds: stats.seconds || 0 }); }} className={`px-4 py-2 rounded-lg font-semibold transition-colors border ${currentExerciseEquipmentMode === 'machine' ? 'bg-chrome-600 hover:bg-chrome-500 border-chrome-400' : 'bg-chrome-900 hover:bg-chrome-800 border-chrome-700'}`}>Machine</button>
                        <button onClick={() => { setCurrentExerciseEquipmentMode('freeweight'); const stats = getPreviousStats(currentExercise.name, 'freeweight'); if (stats) setCurrentSet({ weight: stats.weight, reps: stats.reps, seconds: stats.seconds || 0 }); }} className={`px-4 py-2 rounded-lg font-semibold transition-colors border ${currentExerciseEquipmentMode === 'freeweight' ? 'bg-chrome-600 hover:bg-chrome-500 border-chrome-400' : 'bg-chrome-900 hover:bg-chrome-800 border-chrome-700'}`}>Free Weight</button>
                      </div>
                      {(() => { const stats = getPreviousStats(currentExercise.name, currentExerciseEquipmentMode); if (stats && currentSet.weight > 0) return <div className="bg-chrome-900 border-l-4 border-green-500 rounded-lg p-3 text-sm"><div className="text-green-400 font-semibold mb-1">✓ Previous Best Loaded</div><div className="text-chrome-300">Last: {stats.weight} lbs × {stats.reps} reps{stats.workoutName && <span className="text-chrome-400"> • {stats.workoutName}</span>}</div></div>; })()}
                    </div>
                    <div className="space-y-4 mb-6">
                      <div className="bg-chrome-900 rounded-lg p-4 border border-chrome-700 diamond-plate w-full">
                        <label className="block text-lg font-semibold mb-3 text-center">Weight (lbs)</label>
                        <div className="flex items-center justify-center gap-3">
                          <button onClick={() => { const decrement = currentExerciseEquipmentMode === 'freeweight' && currentSet.weight < 15 ? 1 : 5; setCurrentSet(p => ({ ...p, weight: Math.max(0, p.weight - decrement) })); }} className="bg-chrome-700 hover:bg-chrome-600 p-4 rounded-lg text-2xl font-bold w-20 h-20 border border-chrome-600">−{currentExerciseEquipmentMode === 'freeweight' && currentSet.weight < 15 ? '1' : '5'}</button>
                          <input type="number" value={currentSet.weight} onChange={(e) => setCurrentSet(p => ({ ...p, weight: parseInt(e.target.value) || 0 }))} className="bg-black text-center text-4xl font-mono font-bold py-4 rounded-lg w-32 focus:ring-2 focus:ring-chrome-500 outline-none text-chrome-100 border border-chrome-700" />
                          <button onClick={() => { const increment = currentExerciseEquipmentMode === 'freeweight' && currentSet.weight < 15 ? 1 : 5; setCurrentSet(p => ({ ...p, weight: p.weight + increment })); }} className="bg-chrome-600 hover:bg-chrome-500 p-4 rounded-lg text-2xl font-bold w-20 h-20 border border-chrome-500">+{currentExerciseEquipmentMode === 'freeweight' && currentSet.weight < 15 ? '1' : '5'}</button>
                        </div>
                        {prevStats && <button onClick={() => setCurrentSet(p => ({ ...p, weight: prevStats.weight }))} className="mt-3 w-full text-sm bg-chrome-800 hover:bg-chrome-700 py-2 rounded border border-chrome-700">Use {prevStats.weight} lbs</button>}
                      </div>
                      <div className="bg-chrome-900 rounded-lg p-4 border border-chrome-700 diamond-plate w-full">
                        <label className="block text-lg font-semibold mb-3 text-center">Reps</label>
                        <div className="flex items-center justify-center gap-3">
                          <button onClick={() => setCurrentSet(p => ({ ...p, reps: Math.max(0, p.reps - 1) }))} className="bg-chrome-700 hover:bg-chrome-600 p-4 rounded-lg text-2xl font-bold w-20 h-20 border border-chrome-600">−1</button>
                          <input type="number" value={currentSet.reps} onChange={(e) => setCurrentSet(p => ({ ...p, reps: parseInt(e.target.value) || 0 }))} className="bg-black text-center text-4xl font-mono font-bold py-4 rounded-lg w-32 focus:ring-2 focus:ring-chrome-500 outline-none text-chrome-100 border border-chrome-700" />
                          <button onClick={() => setCurrentSet(p => ({ ...p, reps: p.reps + 1 }))} className="bg-chrome-600 hover:bg-chrome-500 p-4 rounded-lg text-2xl font-bold w-20 h-20 border border-chrome-500">+1</button>
                        </div>
                        {prevStats && <button onClick={() => setCurrentSet(p => ({ ...p, reps: prevStats.reps }))} className="mt-3 w-full text-sm bg-chrome-800 hover:bg-chrome-700 py-2 rounded border border-chrome-700">Use {prevStats.reps} reps</button>}
                      </div>
                    </div>
                    <div className="flex flex-col gap-3">
                      <button onClick={completeSet} disabled={currentSet.weight === 0 && currentSet.reps === 0} className="w-full bg-chrome-600 hover:bg-chrome-500 disabled:bg-chrome-800 disabled:cursor-not-allowed py-5 rounded-lg font-bold text-xl transition-colors border-2 border-chrome-500">Complete Set ✓</button>
                      <button onClick={skipExercise} className="w-full bg-chrome-800 hover:bg-chrome-700 py-4 rounded-lg font-semibold transition-colors border border-chrome-700">Skip Exercise</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          if (activeWorkoutName) {
            return (
              <div className="min-h-screen gorilla-overlay p-4 text-chrome-100">
                <div className="max-w-4xl mx-auto">
                  <div className="bg-chrome-800 rounded-xl p-6 shadow-2xl border border-chrome-600 diamond-plate">
                    <div className="mb-6">
                      <div className="flex flex-col gap-3 mb-4">
                        <h2 className="text-2xl font-bold">{activeWorkoutName}</h2>
                        <div className="flex items-center gap-3 justify-between flex-wrap">
                          <div className="flex items-center gap-3 bg-chrome-900 px-4 py-2 rounded-lg border-2 border-chrome-700">
                            <span className="text-sm font-semibold text-chrome-400">⏱️ Rest</span>
                            <button onClick={() => setRestPeriod(Math.max(30, restPeriod - 30))} className="bg-chrome-700 hover:bg-chrome-600 px-2 py-1 rounded font-bold text-chrome-200">-</button>
                            <span className="text-sm font-mono text-chrome-300 w-16 text-center">{Math.floor(restPeriod / 60)}:{(restPeriod % 60).toString().padStart(2, '0')}</span>
                            <button onClick={() => setRestPeriod(Math.min(600, restPeriod + 30))} className="bg-chrome-700 hover:bg-chrome-600 px-2 py-1 rounded font-bold text-chrome-200">+</button>
                          </div>
                          <div className="flex items-center gap-3 bg-chrome-900 px-4 py-2 rounded-lg border-2 border-chrome-700">
                            <span className="text-sm font-semibold text-chrome-400">🔔 Beep</span>
                            <input type="range" min="0" max="100" value={chirpVolume} onChange={(e) => setChirpVolume(parseInt(e.target.value))} className="w-24 h-2 bg-chrome-700 rounded-lg appearance-none cursor-pointer" style={{ background: `linear-gradient(to right, #6c757d 0%, #6c757d ${chirpVolume}%, #343a40 ${chirpVolume}%, #343a40 100%)` }} />
                            <span className="text-sm font-mono text-chrome-300 w-8">{chirpVolume}%</span>
                          </div>
                        </div>
                      </div>
                      {restTimer && restTimeRemaining > 0 && (
                        <div className="mb-4 p-6 bg-chrome-900 rounded-lg border-4 border-chrome-500 text-center diamond-plate">
                          <div className="text-lg text-chrome-400 mb-2 font-bold">REST PERIOD</div>
                          <div className="text-6xl font-mono font-bold text-chrome-200">{formatTime(restTimeRemaining)}</div>
                          <button onClick={() => { setRestTimer(false); setRestTimeRemaining(0); }} className="mt-3 text-sm text-chrome-400 hover:text-chrome-300 underline">Skip Rest</button>
                        </div>
                      )}
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-sm text-chrome-400">{completedCount} / {totalCount} completed</span>
                      </div>
                      <div className="w-full bg-chrome-900 rounded-full h-3 border border-chrome-700">
                        <div className="bg-gradient-to-r from-chrome-500 to-chrome-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }} />
                      </div>
                    </div>
                    <div className="space-y-3">
                      {currentWorkout.map((exercise, idx) => (
                        <div key={idx} className={`p-4 rounded-lg transition-colors border diamond-plate ${exercise.completed ? 'bg-chrome-700 border-2 border-chrome-500' : exercise.skipped ? 'bg-chrome-900 opacity-50 border-chrome-800' : 'bg-chrome-800 hover:bg-chrome-700 border-chrome-700'}`}>
                          <div className="flex items-center justify-between">
                            <div className="flex-1">
                              <h3 className="font-semibold text-lg" style={{ color: '#39FF14' }}>{exercise.name}</h3>
                              {exercise.completed && exercise.data && <p className="text-sm text-chrome-300 mt-1">{exercise.data.weight} lbs × {exercise.data.reps} reps ({exercise.data.equipmentType})</p>}
                              {exercise.skipped && <p className="text-sm text-chrome-400 mt-1">Skipped</p>}
                            </div>
                            {!exercise.completed && !exercise.skipped && <button onClick={() => startExercise(exercise)} className="bg-chrome-600 hover:bg-chrome-500 px-6 py-3 rounded-lg font-semibold flex items-center gap-2 transition-colors border border-chrome-500">▶ Start</button>}
                            {exercise.skipped && <button onClick={() => { unskipExercise(exercise.name); startExercise(exercise); }} className="bg-chrome-700 hover:bg-chrome-600 px-6 py-3 rounded-lg font-semibold flex items-center gap-2 transition-colors border border-chrome-600">↩ Return</button>}
                            {exercise.completed && <div className="text-chrome-300 font-bold text-2xl">✓</div>}
                          </div>
                        </div>
                      ))}
                    </div>
                    <button onClick={finishWorkout} className="w-full mt-6 bg-chrome-600 hover:bg-chrome-500 py-5 rounded-lg font-bold text-xl transition-colors border-2 border-chrome-500">Finish Workout</button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen gorilla-overlay p-4 text-chrome-100">
              <div className="max-w-4xl mx-auto">
                <div className="text-center mb-8">
                  <h1 className="text-5xl font-bold mb-2 flex items-center justify-center gap-3">🦍 GORILLA STRONG</h1>
                  <p className="text-chrome-400">High-Intensity Training Tracker</p>
                </div>
                <div className="grid grid-cols-2 gap-4 mb-8">
                  <button onClick={() => setShowProgress(true)} className="bg-gradient-to-r from-chrome-700 to-chrome-600 hover:from-chrome-600 hover:to-chrome-500 p-6 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all shadow-lg border border-chrome-600 diamond-plate">📈 View Progress</button>
                  <button onClick={() => setShowWorkoutBuilder(true)} className="bg-gradient-to-r from-chrome-700 to-chrome-600 hover:from-chrome-600 hover:to-chrome-500 p-6 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all shadow-lg border border-chrome-600 diamond-plate">➕ Create Workout</button>
                </div>
                <div className="bg-chrome-800 rounded-xl p-6 shadow-2xl border border-chrome-600 diamond-plate">
                  <h2 className="text-2xl font-bold mb-6 flex items-center gap-2">💪 Choose Your Workout</h2>
                  {customWorkouts.length > 0 && (
                    <>
                      <h3 className="text-lg font-semibold mb-3 text-chrome-300">Your Custom Workouts</h3>
                      <div className="grid grid-cols-1 gap-3 mb-6">
                        {customWorkouts.map(workout => (
                          <div key={workout.id} className="bg-chrome-900 rounded-lg p-4 border border-chrome-700">
                            <div className="flex items-center justify-between mb-2">
                              <h4 className="font-semibold">{workout.name}</h4>
                              <div className="flex gap-2">
                                <button onClick={() => editCustomWorkout(workout)} className="p-2 hover:bg-chrome-800 rounded-lg transition-colors">✏️</button>
                                <button onClick={() => deleteCustomWorkout(workout.id)} className="p-2 hover:bg-red-900 rounded-lg transition-colors">🗑️</button>
                              </div>
                            </div>
                            <p className="text-sm text-chrome-400 mb-3">{workout.exercises.length} exercises</p>
                            <button onClick={() => startWorkout(workout.name)} className="w-full bg-chrome-600 hover:bg-chrome-500 py-2 rounded-lg font-semibold transition-colors border border-chrome-500">Start Workout</button>
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                  <h3 className="text-lg font-semibold mb-3">Default Workouts</h3>
                  <div className="grid grid-cols-1 gap-3">
                    {Object.keys(defaultWorkouts).map(workoutType => (
                      <div key={workoutType} className="bg-chrome-900 rounded-lg p-4 hover:bg-chrome-800 transition-colors border border-chrome-700">
                        <h3 className="font-semibold mb-2">{workoutType}</h3>
                        <p className="text-sm text-chrome-400 mb-3">{defaultWorkouts[workoutType].length} exercises</p>
                        <button onClick={() => startWorkout(workoutType)} className="w-full bg-chrome-600 hover:bg-chrome-500 py-2 rounded-lg font-semibold transition-colors border border-chrome-500">Start Workout</button>
                      </div>
                    ))}
                  </div>
                </div>
                {workoutHistory.length > 0 && (
                  <div className="mt-8 bg-chrome-800 rounded-xl p-6 shadow-2xl border border-chrome-600 diamond-plate">
                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">🏆 Recent Workouts</h3>
                    <div className="space-y-3">
                      {workoutHistory.slice(0, 5).map((workout, idx) => (
                        <div key={idx} className="bg-chrome-900 rounded-lg p-4 border border-chrome-700">
                          <div className="flex items-center justify-between mb-2">
                            <h4 className="font-semibold">{workout.workoutName}</h4>
                            <span className="text-sm text-chrome-400">{new Date(workout.timestamp).toLocaleDateString()}</span>
                          </div>
                          <p className="text-sm text-chrome-400">{workout.exercises.length} exercises completed</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        try {
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(<GorillaStrongApp />);
        } catch (e) {
          console.error('Render error:', e);
          document.getElementById('error-message').style.display = 'block';
        }
    </script>
</body>
</html>
