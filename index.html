<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gorilla Strong</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0d0d0d; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        #root { min-height: 100vh; }
        @media (orientation: landscape) and (max-height: 500px) {
            #root { display: none !important; }
            body { background: #000 !important; }
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .overlay { background: rgba(0,0,0,0.95); min-height: 100vh; padding: 20px; }
        .title { font-size: 36px; font-weight: bold; text-align: center; margin: 20px 0; }
        .subtitle { text-align: center; color: #999; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn { 
            padding: 15px 20px; 
            background: #495057; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background: #343a40; }
        .btn-primary { background: #495057; }
        .btn-primary:hover { background: #343a40; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .card { 
            background: #212529; 
            border: 1px solid #343a40; 
            border-radius: 10px; 
            padding: 20px; 
            margin-bottom: 15px;
        }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #39FF14; }
        .input { 
            width: 100%; 
            padding: 12px; 
            background: #000; 
            color: white; 
            border: 1px solid #343a40; 
            border-radius: 8px; 
            font-size: 16px;
            margin-bottom: 10px;
        }
        .flex { display: flex; gap: 10px; }
        .flex-center { justify-content: center; align-items: center; }
        .mt { margin-top: 20px; }
        .mb { margin-bottom: 20px; }
        .text-center { text-align: center; }
        .exercise-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .exercise-tag { 
            background: #343a40; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 14px;
            color: #39FF14;
        }
        .number-input { 
            font-size: 32px; 
            font-weight: bold; 
            text-align: center; 
            width: 100px;
            padding: 10px;
            background: #000;
            color: white;
            border: 1px solid #343a40;
            border-radius: 8px;
        }
        .big-btn { 
            padding: 20px; 
            font-size: 20px; 
            font-weight: bold;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: #495057;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .big-btn:hover { background: #343a40; }
        .progress-bar { 
            width: 100%; 
            height: 8px; 
            background: #343a40; 
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(to right, #6c757d, #adb5bd);
            transition: width 0.3s;
        }
        .warning { color: #ffc107; }
        .success { color: #28a745; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [screen, setScreen] = useState('menu');
            const [activeWorkout, setActiveWorkout] = useState('');
            const [exercises, setExercises] = useState([]);
            const [currentExerciseIndex, setCurrentExerciseIndex] = useState(0);
            const [weight, setWeight] = useState(0);
            const [reps, setReps] = useState(0);
            const [equipmentType, setEquipmentType] = useState('machine');
            const [workoutHistory, setWorkoutHistory] = useState([]);
            const [restTime, setRestTime] = useState(180);
            const [resting, setResting] = useState(false);
            const [restCounter, setRestCounter] = useState(0);
            const [chirpVolume, setChirpVolume] = useState(50);
            const [isChirping, setIsChirping] = useState(false);
            
            const audioContextRef = useRef(null);
            const chirpIntervalRef = useRef(null);
            const restIntervalRef = useRef(null);

            const workouts = {
                'Full Body': ['Leg Press', 'Chest Press', 'Pulldown', 'Shoulder Press', 'Leg Curl', 'Bicep Curl'],
                'Upper Body': ['Chest Press', 'Pulldown', 'Shoulder Press', 'Bicep Curl'],
                'Lower Body': ['Leg Press', 'Leg Curl', 'Leg Extension', 'Calf Raise'],
                'Push Day': ['Chest Press', 'Shoulder Press', 'Tricep Extension'],
                'Pull Day': ['Pulldown', 'Bicep Curl', 'Row']
            };

            const playChirp = () => {
                if (chirpVolume === 0) return;
                try {
                    if (!audioContextRef.current) {
                        audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioContextRef.current;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 440;
                    const volume = (chirpVolume / 100) * 0.3;
                    gain.gain.setValueAtTime(volume, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                } catch (e) {
                    console.error('Chirp error:', e);
                }
            };

            useEffect(() => {
                if (isChirping) {
                    playChirp();
                    chirpIntervalRef.current = setInterval(playChirp, 4000);
                }
                return () => {
                    if (chirpIntervalRef.current) clearInterval(chirpIntervalRef.current);
                };
            }, [isChirping, chirpVolume]);

            useEffect(() => {
                if (resting && restCounter > 0) {
                    restIntervalRef.current = setInterval(() => {
                        setRestCounter(c => c - 1);
                    }, 1000);
                } else if (restCounter === 0 && resting) {
                    setResting(false);
                    setIsChirping(false);
                }
                return () => {
                    if (restIntervalRef.current) clearInterval(restIntervalRef.current);
                };
            }, [resting, restCounter]);

            useEffect(() => {
                const saved = localStorage.getItem('workoutHistory');
                if (saved) setWorkoutHistory(JSON.parse(saved));
            }, []);

            const startWorkout = (workoutName) => {
                setActiveWorkout(workoutName);
                setExercises(workouts[workoutName].map(name => ({ name, completed: false, weight: 0, reps: 0 })));
                setCurrentExerciseIndex(0);
                setScreen('workout');
            };

            const completeSet = () => {
                if (weight === 0 || reps === 0) return;
                
                const newExercises = [...exercises];
                newExercises[currentExerciseIndex] = {
                    ...newExercises[currentExerciseIndex],
                    completed: true,
                    weight,
                    reps,
                    equipment: equipmentType
                };
                setExercises(newExercises);
                
                if (currentExerciseIndex < exercises.length - 1) {
                    setCurrentExerciseIndex(currentExerciseIndex + 1);
                    setWeight(0);
                    setReps(0);
                    setEquipmentType('machine');
                    setResting(true);
                    setRestCounter(restTime);
                    if (chirpVolume > 0) setIsChirping(true);
                } else {
                    finishWorkout(newExercises);
                }
            };

            const finishWorkout = (finalExercises) => {
                const workout = {
                    name: activeWorkout,
                    date: new Date().toLocaleDateString(),
                    exercises: finalExercises.filter(e => e.completed)
                };
                const newHistory = [workout, ...workoutHistory];
                setWorkoutHistory(newHistory);
                localStorage.setItem('workoutHistory', JSON.stringify(newHistory));
                setScreen('menu');
                setActiveWorkout('');
                setExercises([]);
            };

            const incrementWeight = () => {
                if (equipmentType === 'freeweight' && weight < 15) {
                    setWeight(weight + 1);
                } else {
                    setWeight(weight + 5);
                }
            };

            const decrementWeight = () => {
                if (equipmentType === 'freeweight' && weight < 15) {
                    setWeight(Math.max(0, weight - 1));
                } else {
                    setWeight(Math.max(0, weight - 5));
                }
            };

            if (screen === 'menu') {
                return (
                    <div className="overlay container">
                        <div className="title">🦍 GORILLA STRONG</div>
                        <div className="subtitle">High-Intensity Training Tracker</div>
                        
                        <div className="mb">
                            <h3 style={{marginBottom: '15px'}}>Choose Your Workout</h3>
                            {Object.keys(workouts).map(name => (
                                <button 
                                    key={name}
                                    className="btn btn-primary"
                                    onClick={() => startWorkout(name)}
                                    style={{marginBottom: '10px'}}
                                >
                                    {name}
                                </button>
                            ))}
                        </div>

                        <div className="card">
                            <div className="card-title">⏱️ Rest Period: {Math.floor(restTime/60)}:{(restTime%60).toString().padStart(2,'0')}</div>
                            <div className="flex">
                                <button className="btn" onClick={() => setRestTime(Math.max(30, restTime - 30))}>- 30s</button>
                                <button className="btn" onClick={() => setRestTime(Math.min(600, restTime + 30))}>+ 30s</button>
                            </div>
                        </div>

                        <div className="card">
                            <div className="card-title">🔔 Beep Volume: {chirpVolume}%</div>
                            <input type="range" min="0" max="100" value={chirpVolume} onChange={(e) => setChirpVolume(parseInt(e.target.value))} style={{width: '100%'}} />
                        </div>

                        {workoutHistory.length > 0 && (
                            <div className="card">
                                <div className="card-title">📋 Recent Workouts</div>
                                {workoutHistory.slice(0, 3).map((w, i) => (
                                    <div key={i} style={{padding: '10px', background: '#343a40', marginBottom: '10px', borderRadius: '6px'}}>
                                        <div>{w.name} - {w.date}</div>
                                        <div style={{fontSize: '12px', color: '#999'}}>{w.exercises.length} exercises</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            }

            if (screen === 'workout') {
                const currentEx = exercises[currentExerciseIndex];
                const progress = Math.round((currentExerciseIndex / exercises.length) * 100);

                return (
                    <div className="overlay container">
                        <div className="card">
                            <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '10px'}}>
                                <span>{activeWorkout}</span>
                                <span>{currentExerciseIndex + 1} / {exercises.length}</span>
                            </div>
                            <div className="progress-bar">
                                <div className="progress-fill" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>

                        {resting ? (
                            <div className="card text-center">
                                <div style={{fontSize: '48px', fontWeight: 'bold', color: '#39FF14'}}>
                                    {Math.floor(restCounter / 60)}:{(restCounter % 60).toString().padStart(2, '0')}
                                </div>
                                <button className="btn mt" onClick={() => setResting(false)}>Skip Rest</button>
                            </div>
                        ) : (
                            <>
                                <div className="card">
                                    <div className="card-title" style={{color: '#39FF14'}}>{currentEx.name}</div>
                                    
                                    <div style={{marginBottom: '15px'}}>
                                        <label style={{display: 'block', marginBottom: '8px'}}>Equipment:</label>
                                        <div className="flex">
                                            <button className="btn" style={{background: equipmentType === 'machine' ? '#39FF14' : '#495057', color: equipmentType === 'machine' ? '#000' : '#fff'}} onClick={() => setEquipmentType('machine')}>Machine</button>
                                            <button className="btn" style={{background: equipmentType === 'freeweight' ? '#39FF14' : '#495057', color: equipmentType === 'freeweight' ? '#000' : '#fff'}} onClick={() => setEquipmentType('freeweight')}>Free Weight</button>
                                        </div>
                                    </div>

                                    <div style={{marginBottom: '15px'}}>
                                        <label style={{display: 'block', marginBottom: '8px'}}>Weight (lbs):</label>
                                        <div className="flex flex-center">
                                            <button className="big-btn" onClick={decrementWeight}>−</button>
                                            <input type="number" value={weight} onChange={(e) => setWeight(parseInt(e.target.value) || 0)} className="number-input" />
                                            <button className="big-btn" onClick={incrementWeight}>+</button>
                                        </div>
                                    </div>

                                    <div style={{marginBottom: '15px'}}>
                                        <label style={{display: 'block', marginBottom: '8px'}}>Reps:</label>
                                        <div className="flex flex-center">
                                            <button className="big-btn" onClick={() => setReps(Math.max(0, reps - 1))}>−</button>
                                            <input type="number" value={reps} onChange={(e) => setReps(parseInt(e.target.value) || 0)} className="number-input" />
                                            <button className="big-btn" onClick={() => setReps(reps + 1)}>+</button>
                                        </div>
                                    </div>

                                    <button className="btn btn-primary" onClick={completeSet} disabled={weight === 0 || reps === 0}>Complete Set ✓</button>
                                </div>

                                <div className="card">
                                    <div style={{fontSize: '12px', color: '#999', marginBottom: '8px'}}>Remaining Exercises:</div>
                                    <div className="exercise-list">
                                        {exercises.slice(currentExerciseIndex + 1).map((ex, i) => (
                                            <div key={i} className="exercise-tag">{ex.name}</div>
                                        ))}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                );
            }

            return <div className="overlay text-center">Loading...</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
