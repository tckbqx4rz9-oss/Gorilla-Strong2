            background-attachment: fixed;
        }

        .gorilla-overlay {
            min-height: 100vh;
        }

        /* Hidden video for iOS wake lock workaround */
        #wakelock-video {
            position: fixed;
            top: -10px;
            left: -10px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }

        /* Prevent text selection on buttons */
        button {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Better touch targets */
        button, input {
            min-height: 44px;
        }

            body::before {
